<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="모현욱닷컴 자료실">
  <title>모현욱닷컴</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="#" aria-label="모현욱닷컴 홈">
        <span class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none">
            <rect x="4" y="3" width="19" height="25" rx="2.5" stroke="currentColor" stroke-width="2.2"/>
            <path d="M8 9h11M8 14h8M8 19h7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <circle cx="22.5" cy="21.5" r="6" fill="var(--header-bg)" stroke="currentColor" stroke-width="2.2"/>
            <path d="m27 26 3 3" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          </svg>
        </span>
        <span>모현욱</span>
      </a>

      <nav class="main-nav" aria-label="자료 메뉴">
        <button class="nav-item active" data-category="문제집">문제집</button>
        <button class="nav-item" data-category="실모">실모</button>
        <button class="nav-item" data-category="N제">N제</button>
        <button class="nav-item" data-category="칼럼">칼럼</button>
      </nav>
      <div class="search-wrap">
        <label class="search-box">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg>
          <input id="searchInput" type="search" placeholder="검색" autocomplete="off">
        </label>
        <button class="request-btn" type="button">자료요청</button>
      </div>
    </div>
  </header>

  <main class="main-content">
    <section class="content-head">
      <div>
        <h1 id="pageTitle">문제집</h1>
        <p id="resultCount"></p>
      </div>
      <button id="clearSearch" class="clear-search" hidden>검색 초기화</button>
    </section>

    <section id="materialList" class="material-list" aria-live="polite"></section>

    <section id="emptyState" class="empty-state" hidden>
      <h2>자료가 없습니다.</h2>
      <p id="emptyMessage">등록된 자료가 아직 없습니다.</p>
    </section>

    <nav id="pagination" class="pagination" aria-label="페이지 이동"></nav>
  </main>

  <script src="app.js"></script>
</body>
</html>
